<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>BRAINY STORE — Gestion de boutique</title>
<meta name="description" content="BRAINY STORE - Logiciel professionnel de gestion de boutique">

<!-- ==========================================================
     BRAINY STORE — Application mono-fichier
     Firebase (Auth + Firestore) + Cloudflare R2 (fichiers)
     Voir la documentation complète en fin de fichier (commentaires)
     ========================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
:root{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --surface-2:#eef1f4;
  --border:#e1e6eb;
  --text:#151a21;
  --text-dim:#5b6673;
  --text-faint:#8b95a1;
  --sidebar:#0e1621;
  --sidebar-hover:#1a2432;
  --sidebar-text:#aab4c0;
  --sidebar-text-active:#ffffff;
  --primary:#0f6e66;
  --primary-dark:#0b544e;
  --primary-light:#e4f3f1;
  --accent:#c8792a;
  --accent-light:#fbecd9;
  --danger:#c1382f;
  --danger-light:#fbe8e6;
  --success:#1c8a52;
  --success-light:#e5f6ec;
  --warning:#b9840f;
  --warning-light:#fdf3dd;
  --info:#2065ba;
  --info-light:#e6f0fb;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 1px 2px rgba(15,23,32,.06), 0 1px 8px rgba(15,23,32,.05);
  --shadow-lg:0 12px 32px rgba(15,23,32,.16);
  font-size:15px;
}
[data-theme="dark"]{
  --bg:#0b1119;
  --surface:#121a25;
  --surface-2:#1a2432;
  --border:#232f3f;
  --text:#e7ecf1;
  --text-dim:#9aa7b6;
  --text-faint:#6b7889;
  --sidebar:#080d14;
  --sidebar-hover:#141d29;
  --primary-light:#0f2b28;
  --accent-light:#2a2013;
  --danger-light:#2b1715;
  --success-light:#122a1c;
  --warning-light:#2a2210;
  --info-light:#132638;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:inherit;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Loading screen ---------- */
#boot-screen{
  position:fixed; inset:0; background:var(--sidebar); display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:9999; gap:18px;
}
.boot-logo{font-size:34px; font-weight:800; color:#fff; letter-spacing:-.5px;}
.boot-logo span{color:var(--accent);}
.spinner{
  width:34px; height:34px; border-radius:50%;
  border:3px solid rgba(255,255,255,.15); border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.boot-sub{color:#7c8798; font-size:13px;}

/* ---------- Login ---------- */
#login-screen{
  position:fixed; inset:0; display:none; align-items:center; justify-content:center;
  background:linear-gradient(160deg,#0e1621 0%,#152234 55%,#0e1621 100%);
  z-index:500; padding:20px;
}
.login-card{
  width:100%; max-width:400px; background:var(--surface); border-radius:16px;
  box-shadow:var(--shadow-lg); padding:38px 34px 30px; animation:cardIn .35s ease;
}
@keyframes cardIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
.login-logo{display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:6px;}
.login-logo .mark{
  width:42px; height:42px; border-radius:10px; background:var(--primary);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:19px;
}
.login-logo .name{font-size:21px; font-weight:800; letter-spacing:-.3px;}
.login-logo .name span{color:var(--accent);}
.login-sub{text-align:center; color:var(--text-dim); font-size:13.5px; margin:2px 0 26px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
.field-input-wrap{position:relative;}
.field input{
  width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
  background:var(--surface); color:var(--text); font-size:14.5px; transition:border-color .15s;
}
.field input:focus{outline:none; border-color:var(--primary);}
.pw-toggle{
  position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none;
  color:var(--text-faint); font-size:12.5px; font-weight:600; padding:4px;
}
.btn{
  border:none; border-radius:var(--radius-sm); padding:10px 16px; font-weight:600; font-size:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:filter .12s, transform .05s;
  white-space:nowrap;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-accent{background:var(--accent); color:#fff;}
.btn-accent:hover{filter:brightness(1.08);}
.btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--text);}
.btn-outline:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-danger:hover{filter:brightness(1.1);}
.btn-ghost{background:transparent; color:var(--text-dim);}
.btn-ghost:hover{background:var(--surface-2); color:var(--text);}
.btn-sm{padding:6px 11px; font-size:12.5px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.55; pointer-events:none;}
.login-error{
  background:var(--danger-light); color:var(--danger); font-size:13px; padding:10px 12px;
  border-radius:var(--radius-sm); margin-bottom:16px; display:none; align-items:center; gap:8px;
}
.login-links{display:flex; justify-content:center; margin-top:16px;}
.link-btn{background:none; border:none; color:var(--primary); font-size:13px; font-weight:600;}
.link-btn:hover{text-decoration:underline;}

/* ---------- App shell ---------- */
#app{position:fixed; inset:0; display:none;}
.shell{display:flex; height:100%;}
.sidebar{
  width:236px; background:var(--sidebar); color:var(--sidebar-text); display:flex; flex-direction:column;
  flex-shrink:0; transition:transform .2s ease; z-index:200;
}
.sidebar-head{display:flex; align-items:center; gap:10px; padding:18px 18px 14px;}
.sidebar-head .mark{
  width:34px; height:34px; border-radius:9px; background:var(--primary); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800;
}
.sidebar-head .name{color:#fff; font-weight:800; font-size:16.5px; letter-spacing:-.3px;}
.sidebar-head .name span{color:var(--accent);}
.store-pill{
  margin:0 14px 10px; padding:8px 10px; background:var(--sidebar-hover); border-radius:8px;
  font-size:12px; color:#c3cbd6; display:flex; align-items:center; gap:6px;
}
.nav-scroll{flex:1; overflow-y:auto; padding:4px 10px 14px;}
.nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:#5c6779; padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:8px; font-size:13.6px;
  font-weight:500; color:var(--sidebar-text); cursor:pointer; margin-bottom:2px; transition:background .12s,color .12s;
  border:none; background:none; width:100%; text-align:left;
}
.nav-item .ic{width:18px; text-align:center; font-size:15px;}
.nav-item:hover{background:var(--sidebar-hover); color:#fff;}
.nav-item.active{background:var(--primary); color:#fff;}
.sidebar-foot{padding:12px; border-top:1px solid rgba(255,255,255,.06);}
.user-chip{display:flex; align-items:center; gap:9px; padding:8px; border-radius:8px; cursor:pointer;}
.user-chip:hover{background:var(--sidebar-hover);}
.avatar{
  width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700;
  display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; object-fit:cover;
}
.user-chip .u-name{color:#fff; font-size:13px; font-weight:600; line-height:1.2;}
.user-chip .u-role{color:#8792a1; font-size:11px;}

.main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%;}
.topbar{
  height:60px; flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 20px; gap:14px;
}
.menu-toggle{display:none; background:none; border:none; font-size:20px; color:var(--text);}
.page-title{font-size:17px; font-weight:700;}
.topbar-search{
  flex:1; max-width:380px; display:flex; align-items:center; gap:8px; background:var(--surface-2);
  border:1px solid var(--border); border-radius:8px; padding:7px 12px; margin-left:8px;
}
.topbar-search input{background:none; border:none; outline:none; flex:1; color:var(--text); font-size:13.5px;}
.topbar-actions{display:flex; align-items:center; gap:8px; margin-left:auto;}
.icon-btn{
  width:36px; height:36px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text-dim); position:relative;
}
.icon-btn:hover{background:var(--surface-2); color:var(--text);}
.badge-dot{
  position:absolute; top:-3px; right:-3px; background:var(--danger); color:#fff; font-size:9.5px; font-weight:700;
  min-width:16px; height:16px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 3px;
}
.sync-pill{font-size:11.5px; padding:4px 9px; border-radius:20px; font-weight:600; display:flex; align-items:center; gap:5px;}
.sync-ok{background:var(--success-light); color:var(--success);}
.sync-busy{background:var(--warning-light); color:var(--warning);}
.sync-off{background:var(--danger-light); color:var(--danger);}

.content{flex:1; overflow-y:auto; padding:22px;}
.content-inner{max-width:1400px; margin:0 auto;}

/* ---------- Common UI ---------- */
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.section-head h2{font-size:19px; font-weight:800;}
.section-head .sub{color:var(--text-dim); font-size:13px; margin-top:2px;}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-bottom:20px;}
.stat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;
  box-shadow:var(--shadow);
}
.stat-card .label{font-size:12px; color:var(--text-dim); font-weight:600; display:flex; align-items:center; gap:6px;}
.stat-card .value{font-size:23px; font-weight:800; margin-top:8px; letter-spacing:-.3px;}
.stat-card .delta{font-size:11.5px; margin-top:6px; font-weight:600;}
.delta.up{color:var(--success);} .delta.down{color:var(--danger);}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-head{padding:15px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.card-head h3{font-size:14.5px; font-weight:700;}
.card-body{padding:16px 18px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}

table{width:100%; border-collapse:collapse; font-size:13.4px;}
thead th{
  text-align:left; padding:9px 12px; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px;
  color:var(--text-faint); border-bottom:1.5px solid var(--border); font-weight:700; white-space:nowrap;
}
tbody td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:hover{background:var(--surface-2);}
.table-wrap{overflow-x:auto;}
.badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
.badge-success{background:var(--success-light); color:var(--success);}
.badge-danger{background:var(--danger-light); color:var(--danger);}
.badge-warning{background:var(--warning-light); color:var(--warning);}
.badge-info{background:var(--info-light); color:var(--info);}
.badge-neutral{background:var(--surface-2); color:var(--text-dim);}
.empty-state{padding:50px 20px; text-align:center; color:var(--text-faint);}
.empty-state .ic{font-size:34px; margin-bottom:10px;}
.empty-state .t{font-weight:700; color:var(--text-dim); margin-bottom:4px;}
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px;}
.input, select.input, textarea.input{
  padding:9px 12px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface);
  color:var(--text); font-size:13.6px; width:100%;
}
.input:focus, select.input:focus, textarea.input:focus{outline:none; border-color:var(--primary);}
.form-row{margin-bottom:14px;}
.form-row label{display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
.pager{display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border); font-size:12.5px; color:var(--text-dim);}

/* ---------- Modals ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,14,20,.5); display:none; align-items:center; justify-content:center;
  z-index:1000; padding:16px; backdrop-filter:blur(1px);
}
.modal-overlay.show{display:flex; animation:fadeBg .15s ease;}
@keyframes fadeBg{from{opacity:0;} to{opacity:1;}}
.modal{
  background:var(--surface); border-radius:14px; width:100%; max-width:560px; max-height:90vh; overflow:hidden;
  display:flex; flex-direction:column; box-shadow:var(--shadow-lg); animation:modalIn .18s ease;
}
@keyframes modalIn{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
.modal.wide{max-width:920px;}
.modal-head{padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.modal-head h3{font-size:15.5px; font-weight:700;}
.modal-close{background:none; border:none; font-size:19px; color:var(--text-faint); width:30px; height:30px; border-radius:7px;}
.modal-close:hover{background:var(--surface-2);}
.modal-body{padding:20px; overflow-y:auto;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}

/* ---------- Toasts ---------- */
#toast-wrap{position:fixed; top:16px; right:16px; z-index:2000; display:flex; flex-direction:column; gap:10px; max-width:340px;}
.toast{
  background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--primary); border-radius:9px;
  padding:12px 14px; box-shadow:var(--shadow-lg); display:flex; gap:10px; align-items:flex-start; animation:toastIn .2s ease;
  font-size:13.3px;
}
@keyframes toastIn{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);}}
.toast.success{border-left-color:var(--success);}
.toast.error{border-left-color:var(--danger);}
.toast.warning{border-left-color:var(--warning);}
.toast .t-ic{font-size:16px; margin-top:1px;}
.toast .t-msg{flex:1; color:var(--text); font-weight:500;}
.toast .t-close{background:none; border:none; color:var(--text-faint); font-size:14px;}

/* ---------- POS ---------- */
.pos-layout{display:grid; grid-template-columns:1fr 380px; gap:16px; height:calc(100vh - 122px);}
@media(max-width:1000px){.pos-layout{grid-template-columns:1fr; height:auto;}}
.pos-left{display:flex; flex-direction:column; min-height:0;}
.pos-search-bar{display:flex; gap:8px; margin-bottom:12px;}
.pos-cats{display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; flex-shrink:0;}
.cat-chip{
  padding:7px 14px; border-radius:20px; background:var(--surface); border:1.5px solid var(--border);
  font-size:12.6px; font-weight:600; white-space:nowrap; color:var(--text-dim);
}
.cat-chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
.pos-products{
  flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px;
  align-content:start;
}
.prod-card{
  background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px; cursor:pointer;
  transition:transform .08s, border-color .12s; text-align:left; display:flex; flex-direction:column;
  width:100%;
}
.prod-card:hover{border-color:var(--primary); transform:translateY(-2px);}
.prod-card:active{transform:scale(.97);}
.prod-thumb{
  width:100%; aspect-ratio:1; border-radius:7px; background:var(--surface-2); display:flex; align-items:center;
  justify-content:center; font-size:26px; margin-bottom:8px; overflow:hidden; color:var(--text-faint);
}
.prod-thumb img{width:100%; height:100%; object-fit:cover;}
.prod-card .p-name{font-size:12.6px; font-weight:700; line-height:1.25; margin-bottom:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.prod-card .p-price{font-size:12.5px; color:var(--primary); font-weight:800;}
.prod-card .p-stock{font-size:10.5px; color:var(--text-faint); margin-top:2px;}
.prod-card.disabled{opacity:.4; pointer-events:none;}
.prod-card .p-best-badge{font-size:10px; font-weight:700; color:var(--accent); margin-top:3px;}
.prod-card-wrap{position:relative;}
.fav-star{
  position:absolute; top:6px; right:6px; z-index:2; width:24px; height:24px; border-radius:50%;
  border:1px solid var(--border); background:var(--surface); color:var(--text-faint); font-size:13px;
  display:flex; align-items:center; justify-content:center; padding:0; line-height:1; box-shadow:var(--shadow);
}
.fav-star.active{color:var(--accent); border-color:var(--accent);}

.pos-right{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); display:flex; flex-direction:column; min-height:0;}
.cart-head{padding:14px 16px; border-bottom:1px solid var(--border); font-weight:700; font-size:14px; display:flex; justify-content:space-between; align-items:center;}
.cart-items{flex:1; overflow-y:auto; padding:8px 12px;}
.cart-item{padding:9px 4px; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:center;}
.cart-item .ci-name{font-size:12.8px; font-weight:600; flex:1; min-width:0;}
.cart-item .ci-sub{font-size:11px; color:var(--text-faint);}
.qty-ctrl{display:flex; align-items:center; gap:6px;}
.qty-ctrl button{width:22px; height:22px; border-radius:5px; border:1px solid var(--border); background:var(--surface-2); font-weight:700; font-size:13px; line-height:1;}
.qty-ctrl span{min-width:20px; text-align:center; font-size:12.5px; font-weight:700;}
.ci-remove{background:none; border:none; color:var(--danger); font-size:15px; padding:2px 4px;}
.cart-summary{border-top:1px solid var(--border); padding:12px 16px;}
.sum-row{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; color:var(--text-dim);}
.sum-row.total{font-size:17px; font-weight:800; color:var(--text); margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);}
.cart-foot{padding:12px 16px; display:flex; gap:8px;}

/* Payment modal */
.pay-methods{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
.pay-method{padding:10px; border:1.5px solid var(--border); border-radius:8px; display:flex; flex-direction:column; gap:6px;}
.pay-method .pm-label{font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px;}
.pay-list{margin-top:10px;}
.pay-line{display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px dashed var(--border);}

/* Receipt */
.receipt{
  font-family:'JetBrains Mono',monospace; font-size:12px; width:320px; margin:0 auto; background:#fff; color:#111; padding:14px;
}
.receipt hr{border:none; border-top:1px dashed #999; margin:8px 0;}
.receipt .r-center{text-align:center;}
.receipt .r-row{display:flex; justify-content:space-between; gap:8px;}
.receipt .r-total{font-weight:700; font-size:14px;}

/* login/hide helpers */
.hidden{display:none !important;}
.flex{display:flex;} .items-center{align-items:center;} .gap-8{gap:8px;} .gap-6{gap:6px;}
.text-dim{color:var(--text-dim);} .text-faint{color:var(--text-faint);}
.mt-8{margin-top:8px;} .mt-12{margin-top:12px;} .mb-8{margin-bottom:8px;}

function $(sel, root=document){ return root.querySelector(sel); }
function $all(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }
function el(tag, attrs={}, ...children){
  const node = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k === 'class') node.className = v;
    else if(k === 'html') node.innerHTML = v;
    else if(k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  children.flat().forEach(c => { if(c!=null) node.append(c.nodeType ? c : document.createTextNode(c)); });
  return node;
}
function escapeHtml(str){
  if(str==null) return '';
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

/* ========================== FORMATAGE MONÉTAIRE ==========================

/* ================================ DATES ================================ */
function toDate(v){
  if(!v) return null;
  if(v.toDate) return v.toDate();
  if(v instanceof Date) return v;
  return new Date(v);
}
function fmtDate(v, withTime=false){
  const d = toDate(v); if(!d) return '—';
  const s = d.toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'});
  if(!withTime) return s;
  return s + ' ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
}
function startOfDay(d=new Date()){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function startOfWeek(d=new Date()){ const x=startOfDay(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function startOfMonth(d=new Date()){ const x=startOfDay(d); x.setDate(1); return x; }
function startOfYear(d=new Date()){ const x=startOfDay(d); x.setMonth(0,1); return x; }

/* ============================== PERMISSIONS ==============================
   Le contrôle frontend masque l'UI mais N'EST PAS la sécurité réelle :
   les Firestore Security Rules (voir doc finale) sont la barrière effective. */
const ROLE_LABELS = {
  super_admin:'Super Administrateur', admin:'Administrateur (hérité)', gerant:'Gérant',
  vendeur:'Vendeur (hérité)', caissier:'Caissier', magasinier:'Magasinier (hérité)', comptable:'Comptable (hérité)'

// Rôles officiels du système à 3 niveaux (utilisés pour toute création/modification
// d'utilisateur à partir de maintenant). Les anciens rôles ci-dessus restent lisibles
// et fonctionnels pour les comptes déjà existants (rétrocompatibilité, voir roleTier()).
const OFFICIAL_ROLES = ['super_admin','gerant','caissier'];
const TIER_LABELS = { super_admin:'Super Administrateur', gerant:'Gérant', caissier:'Caissier' };
const TIER_BADGE = { super_admin:'badge-danger', gerant:'badge-info', caissier:'badge-neutral' };

/* ============================== SYSTÈME DE PERMISSIONS À 3 NIVEAUX ==============================
   Toute permission réelle est calculée à partir du "tier" (palier) du rôle, jamais du
   libellé brut, afin de supporter d'anciens comptes (admin/vendeur/magasinier/comptable)
   sans jamais devoir modifier leurs données existantes : roleTier() fait la correspondance. */
const LEGACY_ROLE_TIER = {
  super_admin:'super_admin',
  admin:'gerant',       // ancien "Administrateur" -> aligné sur Gérant (accès métier complet, pas de gestion des comptes)
  gerant:'gerant',
  comptable:'gerant',   // profil finance -> aligné sur Gérant (accès finance/dépenses/rapports)
  magasinier:'gerant',  // profil stock -> aligné sur Gérant (le Caissier n'a pas accès au stock)
  caissier:'caissier',
  vendeur:'caissier'    // profil vente -> aligné sur Caissier
};
function roleTier(role){ return LEGACY_ROLE_TIER[role] || 'caissier'; }
function myTier(){ return roleTier(STATE.profile?.role); }

const TIER_PERMISSIONS = {
  super_admin: ['*'],
  gerant: ['dashboard','pos','sales','products','stock','inventory','purchases','suppliers','customers',
           'finance','cashregister','expenses','employees','sellers','missions','orders','promotions',
           'loyalty','transfers','reports'],
  caissier: ['dashboard','pos','sales','cashregister','customers','employees','sellers','missions']
};
// Clés de sections qui ne sont JAMAIS configurables via le module "Permissions par niveau" :
// leur accès reste géré par une règle métier dédiée, indépendamment du tier.
const PERMISSION_LOCKED_KEYS = ['users'];

/* ============================== PERMISSIONS PERSONNALISÉES (Super Admin) ==============================
   Par défaut, chaque niveau (tier) utilise TIER_PERMISSIONS ci-dessus. Le Super Administrateur peut,
   depuis l'onglet Utilisateurs, redéfinir précisément les onglets accessibles à chaque niveau
   (Gérant, Caissier). Cette configuration est stockée dans le document Firestore settings/permissions
   sous la forme { tiers: { gerant:[...clés...], caissier:[...clés...] } } et chargée au démarrage de
   session dans STATE.customPermissions. Tant qu'aucune configuration n'a été enregistrée, ou pour un
   tier non présent dans la configuration, le comportement par défaut (TIER_PERMISSIONS) s'applique :
   donc rien ne change pour les installations existantes tant que le Super Admin n'a rien configuré. */
async function loadPermissionsConfig(){
  try{
    const cfg = await fsGet('settings','permissions');
    STATE.customPermissions = (cfg && cfg.tiers) ? cfg.tiers : null;
  }catch(e){ STATE.customPermissions = null; }
}
function effectivePermissions(tier){
  if(tier==='super_admin') return ['*'];
  const custom = STATE.customPermissions && Array.isArray(STATE.customPermissions[tier]) ? STATE.customPermissions[tier] : null;
  return custom || TIER_PERMISSIONS[tier] || [];
}
function can(sectionKey){
  if(!STATE.profile) return false;
  // La gestion des comptes/rôles reste toujours strictement réservée au Super Administrateur,
  // quelle que soit la configuration de permissions enregistrée.
  if(PERMISSION_LOCKED_KEYS.includes(sectionKey)) return isSuperAdmin();
  const perms = effectivePermissions(myTier());
  return perms.includes('*') || perms.includes(sectionKey);
}
// Permissions fines sur des opérations sensibles — vérifiées dans la logique métier
// elle-même (pas seulement pour cacher des boutons), donc appelées avant CHAQUE

/* ================================ R2 API ================================
   Toute interaction avec le stockage de fichiers passe EXCLUSIVEMENT par
   ces trois fonctions, qui appellent le Worker Cloudflare (jamais de
   credential R2 ici). Le Worker route PUT/GET/DELETE/HEAD vers env.MY_BUCKET. */
async function uploadToR2(file, folderPath){
  const cleanName = slugFile(file.name);
  const key = `${folderPath}/${Date.now()}_${cleanName}`;
  const res = await fetch(`${R2_WORKER_URL}/${key}`, {
    method:'PUT',
    headers:{ 'Content-Type': file.type || 'application/octet-stream' },
    body:file
  });
  if(!res.ok) throw new Error(`Échec de l'envoi du fichier (${res.status})`);
  return { path:key, url:`${R2_PUBLIC_URL}/${key}` };
}
async function getR2File(path){
  const res = await fetch(`${R2_WORKER_URL}/${path}`);
  if(!res.ok) throw new Error(`Fichier introuvable (${res.status})`);
  return res;
}
async function deleteR2File(path){
  if(!path) return;
  const res = await fetch(`${R2_WORKER_URL}/${path}`, { method:'DELETE' });
  if(!res.ok && res.status !== 404) throw new Error(`Échec de la suppression (${res.status})`);
  return true;
}

/* ============================== FIRESTORE HELPERS ============================== */
async function fsGetAll(colName, ...constraints){
  const q = query(collection(db, colName), ...constraints);
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id:d.id, ...d.data() }));
}
async function fsGet(colName, id){
  const s = await getDoc(doc(db, colName, id));
  return s.exists() ? { id:s.id, ...s.data() } : null;
}
async function fsAdd(colName, data){
  const ref = await addDoc(collection(db, colName), { ...data, dateCreation: serverTimestamp() });
  return ref.id;
}
async function fsSet(colName, id, data){
  await setDoc(doc(db, colName, id), data, { merge:true });
}
async function fsUpdate(colName, id, data){
  await updateDoc(doc(db, colName, id), { ...data, dateModification: serverTimestamp() });
}
async function fsDelete(colName, id){
  await deleteDoc(doc(db, colName, id));
}
/* ============================== LECTURE TRIÉE SANS INDEX COMPOSITE ==============================
   Plusieurs onglets chargent une collection filtrée par boutique (where boutiqueId==...)
   ET triée par date (orderBy). Cette combinaison "where sur un champ + orderBy sur un
   autre champ" nécessite normalement un INDEX COMPOSITE Firestore (d'où l'erreur
   "The query requires an index"). Plutôt que d'exiger la création manuelle de cet index
   pour que l'application fonctionne (ce qui casserait le chargement tant que l'index
   n'est pas construit, une opération qui peut prendre plusieurs minutes après un premier
   déploiement), cette fonction tente d'abord la requête triée côté serveur, PUIS, si
   Firestore répond par une erreur d'index manquant (ou toute autre erreur), se replie
   automatiquement sur une requête filtrée seule (sans orderBy, donc sans index composite
   requis) suivie d'un tri strictement équivalent effectué côté client. Le résultat final
   est donc identique dans les deux cas, sans jamais afficher d'erreur de chargement.
   Voir aussi firestore.indexes.json (fourni séparément) pour déployer les index et
   bénéficier du tri 100% serveur + pagination si le projet le souhaite. */
async function fsGetAllSorted(colName, extraConstraints, sortField, sortDir='desc', limitN=null, useStoreScope=true){
  extraConstraints = extraConstraints || [];
  const scope = (...c)=> useStoreScope ? storeScoped(...c) : c;
  try{
    const serverConstraints = [...extraConstraints, orderBy(sortField, sortDir)];
    if(limitN) serverConstraints.push(limit(limitN));
    return await fsGetAll(colName, ...scope(...serverConstraints));
  }catch(e){
    console.warn(`[BRAINY STORE] Index composite indisponible pour "${colName}" (tri "${sortField}") — repli sur tri local.`, e);
    let list = await fsGetAll(colName, ...scope(...extraConstraints));
    list.sort((a,b)=> toDateOrNumSafe(b[sortField]) - toDateOrNumSafe(a[sortField]));
    if(sortDir==='asc') list.reverse();
    if(limitN) list = list.slice(0, limitN);
    return list;
  }
}
function toDateOrNumSafe(v){
  if(v==null) return 0;
  if(typeof v === 'number') return v;
  if(v.toDate) return v.toDate().getTime();
  if(v instanceof Date) return v.getTime();
  const d = new Date(v); return isNaN(d.getTime()) ? 0 : d.getTime();
}
/* ============================== CRÉATION D'UTILISATEUR (Super Admin) ==============================
   createUserWithEmailAndPassword() connecte automatiquement l'app avec le compte créé.
   Pour ne jamais déconnecter le Super Administrateur qui crée le compte, on utilise une
   seconde instance Firebase temporaire, isolée, détruite juste après usage. */
async function createUserAsAdmin({ email, password, nom, prenom, telephone, role, boutiqueId }){
  if(!canManageUsers()) throw new Error("Seul le Super Administrateur peut créer des utilisateurs.");
  const secondaryApp = initializeApp(firebaseConfig, 'secondary_'+Date.now());
  const secondaryAuth = getAuth(secondaryApp);
  try{
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
    const newUid = cred.user.uid;
    const profileData = {
      id:newUid, uid:newUid, email, nom:nom||'', prenom:prenom||'', telephone:telephone||'',
      photo:'', photoPath:'', role, boutiqueId: boutiqueId||null, actif:true,
      dateCreation: serverTimestamp(), creePar: STATE.user?.uid||null
    };
    await setDoc(doc(db, 'users', newUid), profileData);
    return newUid;
  } finally {
    try{ await signOut(secondaryAuth); }catch(e){}
    try{ await deleteApp(secondaryApp); }catch(e){}
  }
}
function storeScoped(...extra){
  const c = [];
  if(!isSuperAdmin()) c.push(where('boutiqueId','==', currentStoreId()));
  return [...c, ...extra];
}

/* ============================== NUMÉROTATION ==============================
   Génère des numéros séquentiels du type VTE-2026-000001 de façon atomique
   via une transaction Firestore sur un compteur dédié (évite les doublons
   même en cas de ventes simultanées). */
async function nextNumber(prefix){
  const year = new Date().getFullYear();
  const counterId = `${prefix}_${year}`;
  const ref = doc(db, 'counters', counterId);
  const n = await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    const current = snap.exists() ? (snap.data().value||0) : 0;
    const next = current + 1;
    tx.set(ref, { value: next, prefix, year }, { merge:true });
    return next;
  });
  return `${prefix}-${year}-${String(n).padStart(6,'0')}`;
}

/* ============================== SYSTÈME SONORE ==============================
   Génère de courts sons professionnels via Web Audio API (aucun fichier audio
   externe requis — fonctionne dans un fichier HTML autonome). Respecte les
   règles des navigateurs sur l'autoplay : le contexte audio n'est réellement
   démarré/débloqué qu'après la toute première interaction utilisateur. */
let AUDIO_CTX = null;
function getAudioCtx(){
  if(!AUDIO_CTX){
    try{ AUDIO_CTX = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(AUDIO_CTX.state === 'suspended'){ AUDIO_CTX.resume().catch(()=>{}); }
  return AUDIO_CTX;
}
['pointerdown','keydown','touchstart'].forEach(evt=>
  document.addEventListener(evt, ()=>getAudioCtx(), { once:true, passive:true })
);
/** Joue une courte séquence de notes (fréquences en Hz) avec une enveloppe douce. */
function playTone(freqs, { duration=0.12, type='sine', gain=0.16, gap=0 }={}){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    let t = ctx.currentTime;
    freqs.forEach(f=>{
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + duration + 0.02);
      t += duration * 0.55 + gap;
    });
  }catch(e){ /* lecture audio non critique : on ignore silencieusement */ }
}
function playSuccessSound(){ playTone([880, 1318.5], { duration:.11, type:'sine', gain:.16 }); }
function playErrorSound(){ playTone([233, 174.6], { duration:.16, type:'square', gain:.12 }); }
function playWarningSound(){ playTone([659.3, 523.25], { duration:.13, type:'triangle', gain:.14 }); }
function playNotificationSound(){ playTone([740], { duration:.09, type:'sine', gain:.12 }); }
function playActionSound(){ playTone([600], { duration:.06, type:'sine', gain:.09 }); }

/* ============================== NOTIFICATIONS (TOAST) ============================== */
const TOAST_ICONS = { success:'✓', error:'✕', warning:'⚠', info:'ℹ' };
function toast(message, type='info', duration=4200){
  const wrap = $('#toast-wrap');
  const node = el('div', { class:`toast ${type}` },
    el('span',{class:'t-ic'}, TOAST_ICONS[type]||'ℹ'),
    el('span',{class:'t-msg'}, message),
    el('button',{class:'t-close', onclick:()=>node.remove()}, '✕')
  );
  wrap.appendChild(node);
  setTimeout(()=> node.remove(), duration);
  // Chaque notification joue le son correspondant à son type.
  if(type==='success') playSuccessSound();
  else if(type==='error') playErrorSound();
  else if(type==='warning') playWarningSound();
  else playNotificationSound();
}
function friendlyError(error){
  const code = error?.code || '';
  const map = {
    'auth/invalid-email':"Adresse email invalide.",
    'auth/user-not-found':"Aucun compte ne correspond à cet email.",
    'auth/wrong-password':"Mot de passe incorrect.",
    'auth/invalid-credential':"Email ou mot de passe incorrect.",
    'auth/too-many-requests':"Trop de tentatives. Réessayez dans quelques minutes.",
    'auth/network-request-failed':"Problème de connexion réseau.",
    'permission-denied':"Vous n'avez pas la permission d'effectuer cette action."
  };
  return map[code] || error?.message?.replace('Firebase:','').replace(/\(auth\/.*\)/,'').trim() || "Une erreur inattendue est survenue.";
}

/* ============================== MODALS (génériques) ============================== */
function openModal({ title, body, footButtons=[], wide=false, onClose=null }){
  const root = $('#modal-root');
  root.innerHTML = '';
  const modal = el('div', { class:`modal ${wide?'wide':''}` },
    el('div',{class:'modal-head'},
      el('h3',{},title),
      el('button',{class:'modal-close', onclick:()=>closeModal()},'✕')
    ),
    el('div',{class:'modal-body'}, body),
    footButtons.length ? el('div',{class:'modal-foot'}, footButtons) : ''
  );
  root.appendChild(modal);
  root.classList.add('show');
  root._onClose = onClose;
  root.onclick = (e)=>{ if(e.target===root) closeModal(); };
}
function closeModal(){
  const root = $('#modal-root');
  root.classList.remove('show');
  if(root._onClose) try{ root._onClose(); }catch(e){}
  setTimeout(()=>{ root.innerHTML=''; }, 150);
}
function confirmDialog(message, { title='Confirmation', danger=false }={}){
  return new Promise(resolve=>{
    openModal({
      title,
      body: el('p',{}, message),
      footButtons:[
        el('button',{class:'btn btn-outline', onclick:()=>{closeModal(); resolve(false);}}, 'Annuler'),
        el('button',{class:`btn ${danger?'btn-danger':'btn-primary'}`, onclick:()=>{closeModal(); resolve(true);}}, 'Confirmer')
      ]
    });
  });
}

async function renderDashboard(root){
  const todayStart = startOfDay(), weekStart = startOfWeek(), monthStart = startOfMonth(), yearStart = startOfYear();
  const sales = await fsGetAllSorted('sales', [], 'date', 'desc', 500);
  const expenses = await fsGetAllSorted('expenses', [], 'date', 'desc', 300);
  const validSales = sales.filter(s=> s.statut !== 'annulee');

  const sumInRange = (list, dateField, start) => list
    .filter(s => toDate(s[dateField]) && toDate(s[dateField]) >= start)
    .reduce((a,s)=> a + moneyPlain(s.total||0), 0);

  const caJour = sumInRange(validSales,'date', todayStart);
  const caSemaine = sumInRange(validSales,'date', weekStart);
  const caMois = sumInRange(validSales,'date', monthStart);
  const caAnnee = sumInRange(validSales,'date', yearStart);

  const nbVentes = validSales.length;
  const nbPayees = validSales.filter(s=> s.statutPaiement==='payee').length;
  const nbCredit = validSales.filter(s=> s.statutPaiement==='credit' || s.statutPaiement==='partiel').length;
  const nbAnnulees = sales.filter(s=> s.statut==='annulee').length;

  const coutMarchandisesMois = validSales
    .filter(s=> toDate(s.date) >= monthStart)
    .reduce((a,s)=> a + (s.items||[]).reduce((b,i)=> b + moneyPlain(i.prixAchat||0)*toInt(i.quantite||0), 0), 0);
  const margeBruteMois = caMois - coutMarchandisesMois;
  const depensesMois = expenses.filter(e=> toDate(e.date) >= monthStart).reduce((a,e)=> a + moneyPlain(e.montant||0),0);
  const resultatMois = margeBruteMois - depensesMois;
  const tauxMarge = pct(margeBruteMois, caMois);

  const produits = STATE.products;
  const valeurStock = produits.reduce((a,p)=> a + moneyPlain(p.prixAchat||0)*toInt(p.stock||0), 0);
  const stockFaible = produits.filter(p=> toInt(p.stock) > 0 && toInt(p.stock) <= toInt(p.stockMinimum||0));
  const stockEpuise = produits.filter(p=> toInt(p.stock) <= 0);

  const clients = STATE.customers;
  const detteClients = clients.reduce((a,c)=> a + moneyPlain(c.soldeDette||0), 0);

  const last7 = Array.from({length:7}).map((_,i)=>{
    const d = daysAgo(6-i); const next = new Date(d); next.setDate(next.getDate()+1);
    const total = validSales.filter(s=> toDate(s.date) >= d && toDate(s.date) < next).reduce((a,s)=>a+moneyPlain(s.total||0),0);
    return { label: d.toLocaleDateString('fr-FR',{weekday:'short'}), total };
  });

  root.innerHTML = '';
  root.appendChild(el('div',{class:'section-head'},
    el('div',{}, el('h2',{},'Tableau de bord'), el('div',{class:'sub'}, `Bienvenue, ${escapeHtml(STATE.profile.prenom||STATE.profile.email)} — ${fmtDate(new Date(), true)}`))
  ));

  const stat = (label, value, icon, delta) => el('div',{class:'stat-card'},
    el('div',{class:'label'}, el('span',{},icon), label),
    el('div',{class:'value'}, value),
    delta ? el('div',{class:`delta ${delta.up?'up':'down'}`}, delta.text) : ''
  );

  const grid1 = el('div',{class:'stat-grid'},
    stat('CA aujourd\'hui', money(caJour), '📅'),
    stat('CA cette semaine', money(caSemaine), '🗓️'),
    stat('CA ce mois', money(caMois), '📆'),
    stat('CA cette année', money(caAnnee), '📊'),
  );
  const grid2 = el('div',{class:'stat-grid'},
    stat('Bénéfice estimé (mois)', money(resultatMois), '💹'),
    stat('Marge brute (mois)', `${money(margeBruteMois)} · ${tauxMarge}%`, '📈'),
    stat('Ventes (total)', `${nbVentes}`, '🧾', {up:true, text:`${nbPayees} payées · ${nbCredit} à crédit · ${nbAnnulees} annulées`}),
    stat('Valeur du stock', money(valeurStock), '📦'),
  );
  const grid3 = el('div',{class:'stat-grid'},
    stat('Produits en stock faible', stockFaible.length, '⚠️'),
    stat('Produits en rupture', stockEpuise.length, '🔴'),
    stat('Clients enregistrés', clients.length, '👥'),
    stat('Dettes clients', money(detteClients), '💳'),
  );
  root.append(grid1, grid2, grid3);

  const chartsRow = el('div',{class:'grid-2'});
  const c1 = el('div',{class:'card'}, el('div',{class:'card-head'}, el('h3',{},"Chiffre d'affaires — 7 derniers jours")), el('div',{class:'card-body'}, el('canvas',{id:'chart-ca7', height:'220'})));
  const topProducts = computeTopProducts(validSales.filter(s=> toDate(s.date)>=monthStart), 6);
  const c2 = el('div',{class:'card'}, el('div',{class:'card-head'}, el('h3',{},'Top produits du mois')), el('div',{class:'card-body'}, el('canvas',{id:'chart-top', height:'220'})));
  chartsRow.append(c1,c2);
  root.appendChild(chartsRow);

  setTimeout(()=>{
    new Chart($('#chart-ca7'), {
      type:'bar',
      data:{ labels: last7.map(d=>d.label), datasets:[{ label:'CA (FCFA)', data: last7.map(d=>d.total), backgroundColor:'#0f6e66', borderRadius:6 }] },
      options:{ plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>Number(v).toLocaleString('fr-FR') } } } }
    });
    new Chart($('#chart-top'), {
      type:'bar',
      data:{ labels: topProducts.map(p=>p.nom), datasets:[{ label:'Quantité vendue', data: topProducts.map(p=>p.qty), backgroundColor:'#c8792a', borderRadius:6 }] },
      options:{ indexAxis:'y', plugins:{legend:{display:false}} }
    });
  }, 30);

  if(stockFaible.length || stockEpuise.length){
    const alertCard = el('div',{class:'card', style:'margin-top:16px;'},
      el('div',{class:'card-head'}, el('h3',{},'Alertes de stock')),
      el('div',{class:'card-body table-wrap'})
    );
    const tbody = renderStockAlertTable([...stockEpuise, ...stockFaible]);
    alertCard.querySelector('.card-body').appendChild(tbody);
    root.appendChild(alertCard);
  }
}
function computeTopProducts(sales, n){
  const map = new Map();
  sales.forEach(s=> (s.items||[]).forEach(i=>{
    const cur = map.get(i.productId) || { nom:i.nom, qty:0 };
    cur.qty += toInt(i.quantite||0);
    map.set(i.productId, cur);
  }));
  return Array.from(map.values()).sort((a,b)=>b.qty-a.qty).slice(0,n);
}
function renderStockAlertTable(products){

      el('td',{}, toInt(p.stock)),

    )))
  );
  return table;
}

async function duplicateProduct(p){
  const ok = await confirmDialog(`Dupliquer "${p.nom}" ?`);
  if(!ok) return;
  const { id, ...rest } = p;
  rest.nom = rest.nom + ' (copie)';
  rest.sku = ''; rest.codeBarres = ''; rest.stock = 0;
  const newId = await fsAdd('products', rest);
  await logAudit('creation','products', newId, `Produit dupliqué depuis ${p.nom}`);
  toast('Produit dupliqué.','success');
  await preloadReferenceData();
  navigateTo('products');
}
async function toggleProductActive(p){
  const willBeActive = p.actif === false; // s'il était désactivé, on le réactive
  await fsUpdate('products', p.id, { actif: willBeActive });
  await logAudit('modification','products', p.id, `Produit ${willBeActive?'réactivé':'désactivé'} : ${p.nom}`);
  toast(p.actif===false ? 'Produit réactivé.' : 'Produit désactivé.', 'success');
  await preloadReferenceData();
  navigateTo('products');
}

/* ==========================================================================
   STOCK — mouvements réels, transaction Firestore, jamais de modif "silencieuse"
   ========================================================================== */
async function recordStockMovement({productId, type, quantity, previousStock, newStock, reason, referenceId}){
  await fsAdd('stockMovements', {
    productId, type, quantity, previousStock, newStock, reason: reason||'', referenceId: referenceId||null,
    userId: STATE.user.uid, boutiqueId: currentStoreId(), date: serverTimestamp()
  });
}
/** Ajuste le stock d'un produit de façon atomique (+ ou -) et journalise le mouvement. */
async function adjustStock(productId, delta, type, reason, referenceId=null){
  const ref = doc(db, 'products', productId);
  const result = await runTransaction(db, async (tx)=>{
    const snap = await tx.get(ref);
    if(!snap.exists()) throw new Error('Produit introuvable');
    const previousStock = toInt(snap.data().stock||0);
    const newStock = previousStock + delta;
    if(newStock < 0) throw new Error('Stock insuffisant pour cette opération.');
    tx.update(ref, { stock:newStock, dateModification: serverTimestamp() });
    return { previousStock, newStock };
  });
  await recordStockMovement({ productId, type, quantity: Math.abs(delta), previousStock: result.previousStock, newStock: result.newStock, reason, referenceId });
  return result;
}

/* ---------- Tri intelligent du POS : favoris de l'utilisateur, puis produits les
   plus vendus, puis le reste (ordre inchangé) ---------- */
function sortPosProducts(list){
  const favs = new Set(STATE.profile?.favoris || []);
  const counts = STATE.salesCountByProduct || {};
  return list
    .map((p, idx)=>({ p, idx, fav: favs.has(p.id)?1:0, sold: counts[p.id]||0 }))
    .sort((a,b)=> (b.fav-a.fav) || (b.sold-a.sold) || (a.idx-b.idx))
    .map(x=>x.p);
}
/** Récupère (avec cache de 60s) les ventes récentes de la boutique pour calculer
 *  les quantités vendues par produit, utilisées pour prioriser les meilleures ventes
 *  au Point de vente. Ne modifie ni ne supprime aucune donnée existante : lecture seule. */
async function computeBestSellers(){
  try{
    const sales = await fsGetAllSorted('sales', [], 'date', 'desc', 300);
    const counts = {};
    sales.forEach(s=>{
      if(s.statut==='annulee') return;
      (s.items||[]).forEach(it=>{ counts[it.productId] = (counts[it.productId]||0) + toInt(it.quantite); });
    });
    STATE.salesCountByProduct = counts;
  }catch(e){ /* silencieux : le tri retombe simplement sur favoris + ordre existant */ }
}
async function ensureBestSellers(force=false){
  const now = Date.now();
  if(!force && STATE.bestSellersLoadedAt && (now - STATE.bestSellersLoadedAt) < 60000) return;
  await computeBestSellers();
  STATE.bestSellersLoadedAt = Date.now();
}
/** Ajoute/retire un produit des favoris de l'utilisateur connecté. Enregistré sur son
 *  profil (users/{uid}.favoris) : propre à chaque utilisateur, synchronisé Firestore,
 *  ne touche à aucune autre donnée du profil. */
async function toggleFavorite(productId){
  if(!STATE.profile) return;
  const current = new Set(STATE.profile.favoris || []);
  if(current.has(productId)) current.delete(productId); else current.add(productId);
  const arr = Array.from(current);
  STATE.profile.favoris = arr;
  renderPosGrid($('.cat-chip.active')?.dataset.cat==='Tous'?'':$('.cat-chip.active')?.dataset.cat, $('#pos-search')?.value||'');
  try{ await fsUpdate('users', STATE.user.uid, { favoris: arr }); }
  catch(e){ toast(friendlyError(e),'error'); }
}
function renderPosGrid(cat, term){
  const grid = $('#pos-products'); if(!grid) return;
  term = (term||'').toLowerCase();
  let list = STATE.products.filter(p=> p.actif !== false);
  if(cat) list = list.filter(p=> p.categorie===cat);
  if(term) list = list.filter(p=> [p.nom,p.sku,p.reference,p.codeBarres].some(v=>(v||'').toLowerCase().includes(term)));
  list = sortPosProducts(list);
  grid.innerHTML = '';
  if(!list.length){ grid.appendChild(el('div',{class:'empty-state'},'Aucun produit trouvé')); return; }
  const favs = new Set(STATE.profile?.favoris || []);
  const counts = STATE.salesCountByProduct || {};
  list.forEach(p=>{
    const out = toInt(p.stock) <= 0;
    const isFav = favs.has(p.id);
    const sold = counts[p.id] || 0;
    grid.appendChild(el('div',{class:'prod-card-wrap'},
      el('button',{class:`prod-card ${out?'disabled':''}`, onclick:()=> addToCart(p)},
        el('div',{class:'prod-thumb'}, p.photoUrl ? el('img',{src:p.photoUrl}) : '📦'),
        el('div',{class:'p-name'}, p.nom),
        el('div',{class:'p-price'}, money(p.prixVente)),
        el('div',{class:'p-stock'}, out? 'Rupture' : `Stock: ${toInt(p.stock)}`),
        sold>0 ? el('div',{class:'p-best-badge'}, '🔥 Populaire') : ''
      ),
      el('button',{class:`fav-star ${isFav?'active':''}`, type:'button', title: isFav?'Retirer des favoris':'Ajouter aux favoris', onclick:(e)=>{ e.stopPropagation(); toggleFavorite(p.id); }}, isFav?'★':'☆')
    ));
  });
}

function addToCart(product){
  if(!product || !product.id){ toast('Produit non sélectionné.','warning'); return; }
  if(toInt(product.stock)<=0){ toast('Ce produit est en rupture de stock.','warning'); return; }
  const existing = STATE.cart.find(i=>i.productId===product.id);
  if(existing){
    if(existing.quantite+1 > toInt(product.stock)){ toast('Quantité demandée supérieure au stock disponible.','warning'); return; }
    existing.quantite++;
  } else {
    STATE.cart.push({ productId:product.id, nom:product.nom, prixVente: toInt(product.prixVente), prixAchat: toInt(product.prixAchat||0), quantite:1, remise:0, stockDispo: toInt(product.stock) });
  }
  playActionSound();
  renderCart();
}
function renderCart(){
  const wrap = $('#cart-items'); if(!wrap) return;
  wrap.innerHTML = '';
  if(!STATE.cart.length){ wrap.appendChild(el('div',{class:'empty-state'}, el('div',{class:'ic'},'🛒'), 'Panier vide')); }
  STATE.cart.forEach((item,idx)=>{
    const subtotal = item.prixVente*item.quantite - moneyPlain(item.remise||0);
    wrap.appendChild(el('div',{class:'cart-item'},
      el('div',{style:'flex:1;min-width:0;'},
        el('div',{class:'ci-name'}, item.nom),
        el('div',{class:'ci-sub'}, `${money(item.prixVente)} × ${item.quantite} = ${money(subtotal)}`)
      ),
      el('div',{class:'qty-ctrl'},
        el('button',{onclick:()=>changeQty(idx,-1)}, '−'),
        el('span',{}, item.quantite),
        el('button',{onclick:()=>changeQty(idx,1)}, '+')
      ),
      el('button',{class:'ci-remove', onclick:()=>{STATE.cart.splice(idx,1); renderCart();}}, '✕')
    ));
  });
  const subtotal = STATE.cart.reduce((a,i)=>a+i.prixVente*i.quantite,0);
  const discount = STATE.cart.reduce((a,i)=>a+moneyPlain(i.remise||0),0) + (STATE.globalDiscount||0);
  const total = Math.max(0, subtotal - discount);
  const summary = $('#cart-summary');
  summary.innerHTML = '';
  summary.append(
    el('div',{class:'sum-row'}, el('span',{},'Sous-total'), el('span',{}, money(subtotal))),
    el('div',{class:'sum-row'}, el('span',{},'Remise'), el('span',{}, '- '+money(discount))),
    el('div',{class:'sum-row total'}, el('span',{},'Total'), el('span',{}, money(total)))
  );
  const payBtn = $('#cart-pay-btn');
  if(payBtn) payBtn.disabled = STATE.cart.length===0;
}
function changeQty(idx, delta){
  const item = STATE.cart[idx];
  const newQty = item.quantite + delta;
  if(newQty<=0){ STATE.cart.splice(idx,1); renderCart(); return; }
  if(newQty > item.stockDispo){ toast('Quantité supérieure au stock disponible.','warning'); return; }
  item.quantite = newQty;
  renderCart();
}

const PAYMENT_METHODS = [

function openPaymentModal(){
  if(!STATE.cart.length){ toast('Le panier est vide.','warning'); return; }
  const subtotal = STATE.cart.reduce((a,i)=>a+i.prixVente*i.quantite,0);
  const discount = STATE.cart.reduce((a,i)=>a+moneyPlain(i.remise||0),0) + (STATE.globalDiscount||0);
  const total = Math.max(0, subtotal - discount);

  const body = el('div',{});

    el('select',{class:'input', id:'pay-customer'}, el('option',{value:''},'Client de passage'), ...STATE.customers.map(c=>el('option',{value:c.id}, `${c.prenom||''} ${c.nom||''}`.trim() + (c.telephone? ' — '+c.telephone:'')))));
  const totalRow = el('div',{class:'sum-row total'}, el('span',{},'Total à payer'), el('span',{id:'pay-total-display'}, money(total)));
  const methodsGrid = el('div',{class:'pay-methods'}, ...PAYMENT_METHODS.map(m=> el('div',{class:'pay-method'},
    el('div',{class:'pm-label'}, m.icon+' '+m.label),
    el('input',{class:'input', type:'number', min:'0', placeholder:'0', id:`pm-${m.key}`, oninput: updateRemaining})
  )));
  const remainingBox = el('div',{class:'sum-row', style:'margin-top:8px;'}, el('span',{},'Reste à payer / Monnaie'), el('span',{id:'pay-remaining', style:'font-weight:800;'}, money(total)));
  const creditNote = el('div',{class:'text-dim', style:'font-size:12px;margin-top:6px;', id:'credit-note'});

  body.append(custRow, totalRow, methodsGrid, remainingBox, creditNote);

  function collectedAmount(){
    return PAYMENT_METHODS.reduce((a,m)=> a + toInt($(`#pm-${m.key}`)?.value||0), 0);
  }
  function updateRemaining(){
    const collected = collectedAmount();
    const remaining = total - collected;
    const box = $('#pay-remaining');
    if(remaining > 0){ box.textContent = `Reste dû : ${money(remaining)}`; box.style.color = 'var(--danger)'; }
    else if(remaining < 0){ box.textContent = `Monnaie à rendre : ${money(-remaining)}`; box.style.color = 'var(--success)'; }
    else { box.textContent = 'Montant exact reçu'; box.style.color = 'var(--success)'; }
    $('#credit-note').textContent = remaining>0 ? 'Un solde sera enregistré comme dette client (client requis).' : '';
  }
  

  openModal({
    title:'Encaissement', body, wide:true,
    footButtons:[
      el('button',{class:'btn btn-outline', onclick:closeModal},'Annuler'),
      el('button',{class:'btn btn-primary', onclick: async (e)=>{
        if(!STATE.cart.length){ toast('Le panier est vide.','warning'); return; }
        const collected = collectedAmount();
        const remaining = total - collected;
        const customerId = $('#pay-customer').value || null;
        if(remaining > 0 && !customerId){ toast('Sélectionnez un client pour enregistrer une vente à crédit.','warning'); return; }
        if(collected === 0 && total > 0){ toast('Renseignez au moins un mode de paiement.','warning'); return; }
        // Vérification finale du stock disponible juste avant l'encaissement (le stock
        // a pu changer depuis l'ajout au panier), pour éviter toute vente invalide.
        for(const item of STATE.cart){
          const prod = STATE.products.find(p=>p.id===item.productId);
          if(!prod){ toast(`Le produit "${item.nom}" est introuvable.`,'error'); return; }
          if(toInt(prod.stock) < item.quantite){ toast(`Stock insuffisant pour "${item.nom}" (disponible : ${toInt(prod.stock)}).`,'error'); return; }
        }
        const btn = e.target; btn.disabled = true; btn.textContent = 'Traitement…';
        const usedPayments = PAYMENT_METHODS.map(m=>({method:m.key, montant: toInt($(`#pm-${m.key}`)?.value||0)})).filter(p=>p.montant>0);
        try{
          const sale = await finalizeSale({ total, subtotal, discount, customerId, payments: usedPayments, amountPaid: Math.min(collected,total), remaining: Math.max(remaining,0) });
          closeModal();
          openReceiptModal(sale);
        }catch(error){ console.error(error); toast(friendlyError(error),'error'); btn.disabled=false; btn.textContent='Valider le paiement'; }
      }}, 'Valider le paiement')
    ]
  });
  updateRemaining();
}

/** Enregistre la vente de façon transactionnelle : décrémente le stock produit par produit,
 *  enregistre les mouvements de stock, met à jour la dette client si nécessaire,
 *  crédite la caisse ouverte, et journalise l'audit. */
async function finalizeSale({ total, subtotal, discount, customerId, payments, amountPaid, remaining }){
  const numero = await nextNumber('VTE');
  const items = STATE.cart.map(i=>({ productId:i.productId, nom:i.nom, prixVente:i.prixVente, prixAchat:i.prixAchat, quantite:i.quantite, remise:moneyPlain(i.remise||0) }));

  // 1) Décrément atomique du stock pour chaque article + mouvement de stock.
  //    Si un article échoue en cours de route (stock insuffisant détecté au dernier
  //    moment, coupure réseau, etc.), on annule (rollback) les décréments déjà
  //    effectués pour les articles précédents afin de ne JAMAIS corrompre le stock.
  const adjustedItems = [];
  try{
    for(const item of items){
      await adjustStock(item.productId, -item.quantite, 'vente', `Vente ${numero}`, null);
      adjustedItems.push(item);
    }
  }catch(stockError){
    for(const item of adjustedItems){
      try{ await adjustStock(item.productId, item.quantite, 'ajustement', `Annulation automatique — échec vente ${numero}`, null); }
      catch(rollbackError){ console.error('Échec du rollback de stock', rollbackError); }
    }
    throw stockError;
  }

  const statutPaiement = remaining>0 ? (amountPaid>0 ? 'partiel' : 'credit') : 'payee';
  const saleData = {
    numero, items, subtotal: moneyPlain(subtotal), discount: moneyPlain(discount), total: moneyPlain(total),
    amountPaid: moneyPlain(amountPaid), remaining: moneyPlain(remaining), payments, customerId: customerId||null,
    statut:'validee', statutPaiement, vendeurId: STATE.user.uid,
    vendeurNom: `${STATE.profile.prenom||''} ${STATE.profile.nom||''}`.trim(),
    boutiqueId: currentStoreId(), boutiqueNom: STATE.store?.nom||'', date: serverTimestamp()
  };
  const saleId = await fsAdd('sales', saleData);

  // 2) Mise à jour de la dette client si vente à crédit/partielle
  if(customerId && remaining>0){
    const custRef = doc(db,'customers',customerId);
    await runTransaction(db, async(tx)=>{
      const snap = await tx.get(custRef);
      const currentDebt = snap.exists() ? moneyPlain(snap.data().soldeDette||0) : 0;
      tx.update(custRef, { soldeDette: currentDebt + moneyPlain(remaining) });
    });
  }

  // 3) Mise à jour de la caisse ouverte (si une session de caisse est active)
  await addCashMovementIfOpen({ type:'recette', montant: moneyPlain(amountPaid), description:`Vente ${numero}`, referenceId:saleId });

  // 4) Journal d'audit
  await logAudit('vente','sales', saleId, `Vente ${numero} — ${money(total)}`);

  STATE.cart = []; STATE.globalDiscount = 0;
  await preloadReferenceData();
  STATE.bestSellersLoadedAt = 0; // invalide le cache "meilleures ventes" pour refléter cette vente
  toast(`Vente ${numero} enregistrée avec succès.`, 'success');
  return { id:saleId, ...saleData, date:new Date() };
}

      if(amount<=0 || amount>moneyPlain(customer.soldeDette)){ toast('Montant invalide.','warning'); return; }
      try{
        const custRef = doc(db,'customers',customer.id);
        await runTransaction(db, async(tx)=>{
          const snap = await tx.get(custRef);
          const debt = moneyPlain(snap.data().soldeDette||0);
          tx.update(custRef, { soldeDette: Math.max(0, debt-amount) });
        });
        await fsAdd('customerPayments', { customerId:customer.id, montant:amount, methode:$('#cp-method').value, boutiqueId:currentStoreId(), userId:STATE.user.uid, date:serverTimestamp() });
        await addCashMovementIfOpen({ type:'recette', montant:amount, description:`Paiement dette client ${customer.prenom||''} ${customer.nom||''}`, referenceId:customer.id });
        await logAudit('paiement','customers', customer.id, `Paiement de ${money(amount)} reçu`);
        toast('Paiement enregistré.','success');
        await preloadReferenceData(); closeModal(); navigateTo('customers');
      }catch(error){ toast(friendlyError(error),'error'); }
    }}, 'Enregistrer le paiement')
  ]});
}

let CURRENT_CASH_SESSION = null;

  const list = await fsGetAll('cashRegisters', ...storeScoped(where('statut','==','ouverte')));
  CURRENT_CASH_SESSION = list[0] || null;
  return CURRENT_CASH_SESSION;
}
async function addCashMovementIfOpen({type, montant, description, referenceId}){
  const session = await getOpenCashSession();

async function deleteExpense(expense){
  const ok = await confirmDialog(`Supprimer la dépense "${expense.libelle}" (${money(expense.montant)}) ?`, {title:'Suppression', danger:true});
  if(!ok) return;
  try{
    if(expense.justificatifPath) await deleteR2File(expense.justificatifPath).catch(()=>{});
    await fsDelete('expenses', expense.id);
    await logAudit('suppression','expenses', expense.id, `Dépense "${expense.libelle}" supprimée`);
    toast('Dépense supprimée.','success');
    navigateTo('expenses');
  }catch(e){ toast(friendlyError(e),'error'); }
}

/* ==========================================================================
   FINANCE — vue consolidée (ventes, dépenses, achats, mouvements manuels)
   ========================================================================== */
function periodRange(key){
  const now = new Date();
  if(key==='today') return { start:startOfDay(now), end:now };
  if(key==='week') return { start:startOfWeek(now), end:now };
  if(key==='year') return { start:startOfYear(now), end:now };
  if(key==='all') return { start:new Date(2000,0,1), end:now };
  return { start:startOfMonth(now), end:now }; // 'month' par défaut
}
function periodSelect(current, onChange){
  const opts = [['today','Aujourd\'hui'],['week','Cette semaine'],['month','Ce mois-ci'],['year','Cette année'],['all','Tout']];
  return el('select',{class:'input', style:'max-width:200px;', onchange:(e)=>onChange(e.target.value)},
    ...opts.map(([v,l])=> el('option',{value:v, selected:current===v?'selected':null}, l)));
}
function toDateSafe(v){
  if(!v) return new Date(0);
  if(v.toDate) return v.toDate();
  return new Date(v);
}
function inRange(dateVal, range){
  const d = toDateSafe(dateVal);
  return d >= range.start && d <= new Date(range.end.getTime()+86400000);
}

async function renderFinance(root){
  root.innerHTML='';
  if(!canManageFinance()){
    root.innerHTML = `<div class="empty-state"><div class="ic">🔒</div><div class="t">Accès réservé</div><div>Seuls le Super Administrateur et le Gérant consultent la finance globale.</div></div>`;
    return;
  }
  STATE._financePeriod = STATE._financePeriod || 'month';
  const range = periodRange(STATE._financePeriod);

  const [sales, customerPayments, expenses] = await Promise.all([
    fsGetAll('sales', ...storeScoped()).catch(()=>[]),
    fsGetAll('customerPayments', ...storeScoped()).catch(()=>[]),
    fsGetAll('expenses', ...storeScoped()).catch(()=>[])
  ]);
  // Achats : module de la Phase 3 (Lot 3). On l'interroge dès maintenant, en toute
  // sécurité (try/catch), afin que la Finance reflète automatiquement les achats
  // dès qu'ils existeront, sans qu'il soit nécessaire de retoucher ce module.
  let purchases = [];
  try{ purchases = await fsGetAll('purchases', ...storeScoped()); }catch(e){ purchases = []; }
  let financeMovements = [];
  try{ financeMovements = await fsGetAll('financeMovements', ...storeScoped()); }catch(e){ financeMovements = []; }

  const salesInRange = sales.filter(s=> inRange(s.date, range) && s.statut==='validee');
  const paymentsInRange = customerPayments.filter(p=> inRange(p.date, range));
  const expensesInRange = expenses.filter(x=> inRange(x.date, range));
  const purchasesInRange = purchases.filter(p=> inRange(p.date||p.dateCreation, range) && p.statut!=='annulee');
  const manualRecettes = financeMovements.filter(m=> inRange(m.date, range) && m.type==='recette');
  const manualDepenses = financeMovements.filter(m=> inRange(m.date, range) && m.type==='depense');

  const recetteVentes = salesInRange.reduce((a,s)=>a+moneyPlain(s.amountPaid),0);
  const recettePaiements = paymentsInRange.reduce((a,p)=>a+moneyPlain(p.montant),0);
  const recetteManuelle = manualRecettes.reduce((a,m)=>a+moneyPlain(m.montant),0);
  const totalRecettes = recetteVentes + recettePaiements + recetteManuelle;

  const depenseCourantes = expensesInRange.reduce((a,x)=>a+moneyPlain(x.montant),0);
  const depenseAchats = purchasesInRange.reduce((a,p)=>a+moneyPlain(p.totalTTC||p.total||0),0);
  const depenseManuelle = manualDepenses.reduce((a,m)=>a+moneyPlain(m.montant),0);
  const totalDepenses = depenseCourantes + depenseAchats + depenseManuelle;

  const solde = totalRecettes - totalDepenses;
  const coutVenduTotal = salesInRange.reduce((a,s)=> a + (s.items||[]).reduce((b,i)=>b+i.prixAchat*i.quantite,0), 0);
  const beneficeBrut = salesInRange.reduce((a,s)=>a+moneyPlain(s.total),0) - coutVenduTotal;

  root.appendChild(el('div',{class:'section-head'},
    el('div',{}, el('h2',{},'Finance'), el('div',{class:'sub'},'Vue consolidée des recettes, dépenses et achats')),
    el('div',{style:'display:flex; gap:8px;'},
      periodSelect(STATE._financePeriod, v=>{ STATE._financePeriod=v; navigateTo('finance'); }),
      el('button',{class:'btn btn-primary', onclick:()=>openFinanceMovementForm()}, '+ Mouvement financier')
    )
  ));

  root.appendChild(el('div',{class:'stat-grid'},
    el('div',{class:'stat-card'}, el('div',{class:'label'},'Total recettes'), el('div',{class:'value', style:'color:var(--success);'}, money(totalRecettes))),
    el('div',{class:'stat-card'}, el('div',{class:'label'},'Total dépenses'), el('div',{class:'value', style:'color:var(--danger);'}, money(totalDepenses))),
    el('div',{class:'stat-card'}, el('div',{class:'label'},'Solde net'), el('div',{class:'value', style:`color:${solde>=0?'var(--success)':'var(--danger)'};`}, money(solde))),
    el('div',{class:'stat-card'}, el('div',{class:'label'},'Bénéfice brut ventes'), el('div',{class:'value'}, money(beneficeBrut))),
  ));

  root.appendChild(el('div',{class:'card'}, el('div',{class:'card-body'},
    el('h3',{style:'margin-bottom:10px;'},'Détail des recettes'),
    financeRow('Ventes encaissées', recetteVentes),
    financeRow('Paiements de dettes clients', recettePaiements),
    financeRow('Autres recettes', recetteManuelle),
    el('h3',{style:'margin:16px 0 10px;'},'Détail des dépenses'),
    financeRow('Dépenses courantes', depenseCourantes, true),
    financeRow('Achats fournisseurs', depenseAchats, true),
    financeRow('Autres dépenses', depenseManuelle, true),
  )));

  const movements = [
    ...salesInRange.map(s=>({date:s.date, type:'recette', libelle:`Vente ${s.numero||''}`, montant:s.amountPaid})),
    ...paymentsInRange.map(p=>({date:p.date, type:'recette', libelle:'Paiement dette client', montant:p.montant})),
    ...manualRecettes.map(m=>({date:m.date, type:'recette', libelle:m.description||'Recette manuelle', montant:m.montant})),
    ...expensesInRange.map(x=>({date:x.date, type:'depense', libelle:x.libelle, montant:x.montant})),
    ...purchasesInRange.map(p=>({date:p.date||p.dateCreation, type:'depense', libelle:`Achat ${p.numero||''} — ${p.fournisseurNom||''}`, montant:p.totalTTC||p.total||0})),
    ...manualDepenses.map(m=>({date:m.date, type:'depense', libelle:m.description||'Dépense manuelle', montant:m.montant})),
  ].sort((a,b)=> toDateSafe(b.date)-toDateSafe(a.date)).slice(0,100);

  const card = el('div',{class:'card'}, el('div',{class:'table-wrap'}));
  const table = el('table',{},
    el('thead',{}, el('tr',{}, el('th',{},'Date'), el('th',{},'Type'), el('th',{},'Libellé'), el('th',{},'Montant'))),

  }
  let users = [];
  try{ users = await fsGetAll('users'); }catch(e){ toast(friendlyError(e),'error'); }
  let stores = STATE.stores;
  try{ stores = await fsGetAll('stores'); STATE.stores = stores; }catch(e){}

  root.appendChild(el('div',{class:'section-head'},
    el('div',{}, el('h2',{},'Utilisateurs'), el('div',{class:'sub'}, `${users.length} compte(s) — 3 niveaux : Super Administrateur, Gérant, Caissier`)),
    el('div',{style:'display:flex; gap:8px; flex-wrap:wrap;'},

  ));

  const wrap = el('div',{class:'table-wrap'});
  const tbody = el('tbody',{});

    el('thead',{}, el('tr',{},
      el('th',{},''), el('th',{},'Nom'), el('th',{},'Email'), el('th',{},'Rôle'),
      el('th',{},'Boutique'), el('th',{},'Statut'), el('th',{},'Actions')
    )),
    tbody
  );
  if(!users.length){
    tbody.appendChild(el('tr',{}, el('td',{colspan:'7'}, el('div',{class:'empty-state'}, el('div',{class:'ic'},'🧑‍🤝‍🧑'), el('div',{class:'t'},'Aucun utilisateur')))));
  } else {
    users.sort((a,b)=> (a.prenom||a.email||'').localeCompare(b.prenom||b.email||''));
    users.forEach(u=>{
      const tier = roleTier(u.role);
      const storeName = stores.find(s=>s.id===u.boutiqueId)?.nom || (tier==='super_admin' ? 'Toutes' : '—');
      const isSelf = u.id === STATE.user?.uid;
      tbody.appendChild(el('tr',{},
        el('td',{}, u.photo ? el('img',{src:u.photo, style:'width:32px;height:32px;border-radius:50%;object-fit:cover;'}) : el('div',{class:'avatar', style:'width:32px;height:32px;font-size:12px;'}, (u.prenom?.[0]||u.email?.[0]||'?').toUpperCase())),
        el('td',{}, el('div',{style:'font-weight:600;'}, `${u.prenom||''} ${u.nom||''}`.trim()||'—'), isSelf? el('div',{class:'text-faint', style:'font-size:11px;'},'(vous)') : ''),
        el('td',{}, u.email||'—'),

        el('td',{}, storeName),

        el('td',{}, el('div',{style:'display:flex; gap:6px; flex-wrap:wrap;'},
          el('button',{class:'btn btn-outline btn-sm', onclick:()=> openUserFormModal(u, stores)}, 'Modifier'),
          el('button',{class:'btn btn-outline btn-sm', onclick: async ()=>{
            if(!u.email){ toast("Cet utilisateur n'a pas d'email.",'warning'); return; }
            try{ await sendPasswordResetEmail(auth, u.email); toast('Email de réinitialisation envoyé.','success'); }
            catch(e){ toast(friendlyError(e),'error'); }
          }}, 'Réinit. mot de passe'),
          isSelf ? '' : el('button',{class:`btn btn-sm ${u.actif===false?'btn-primary':'btn-danger'}`, onclick: async ()=>{
            const ok = await confirmDialog(u.actif===false ? `Réactiver ${u.email} ?` : `Désactiver ${u.email} ? Il ne pourra plus se connecter.`, {title:'Confirmation', danger:u.actif!==false});
            if(!ok) return;
            try{
              await fsUpdate('users', u.id, { actif: u.actif===false });
              await logAudit(u.actif===false?'activation':'desactivation','users', u.id, `Compte ${u.email} ${u.actif===false?'réactivé':'désactivé'}`);
              toast('Statut mis à jour.','success');
              navigateTo('users');

  wrap.appendChild(table);

/* ==========================================================================
   PERMISSIONS PAR NIVEAU (Super Administrateur uniquement)
   Permet de choisir, pour chaque niveau (Gérant, Caissier), les onglets
   accessibles. Les rôles hérités (admin/comptable/magasinier → tier "gerant",
   vendeur → tier "caissier", voir roleTier()) suivent automatiquement les
   permissions de leur niveau, sans qu'il soit besoin de les configurer à part.
   Rien n'est modifié tant que le Super Admin n'enregistre pas volontairement
   une configuration : le comportement par défaut (TIER_PERMISSIONS) reste
   inchangé pour ne casser aucun compte existant. ========================== */
function openPermissionsModal(){
  if(!isSuperAdmin()){ toast("Seul le Super Administrateur peut gérer les permissions.",'warning'); return; }
  const editableTiers = ['gerant','caissier'];
  const working = {};
  editableTiers.forEach(t=> working[t] = new Set(effectivePermissions(t)));
  let activeTier = 'gerant';

  const tabsBar = el('div',{style:'display:flex; gap:8px; margin-bottom:14px;'});
  const listWrap = el('div',{id:'perm-list-wrap', style:'max-height:48vh; overflow-y:auto;'});

  function renderTabsBar(){
    tabsBar.innerHTML = '';
    editableTiers.forEach(t=>{
      tabsBar.appendChild(el('button',{
        class:`btn btn-sm ${activeTier===t?'btn-primary':'btn-outline'}`, type:'button',
        onclick:()=>{ activeTier=t; renderTabsBar(); renderCheckboxList(); }
      }, TIER_LABELS[t]));
    });
  }
  function renderCheckboxList(){
    listWrap.innerHTML = '';
    NAV_GROUPS.forEach(group=>{
      const items = group.items.filter(it=> !PERMISSION_LOCKED_KEYS.includes(it.key));
      if(!items.length) return;
      listWrap.appendChild(el('div',{class:'nav-group-label', style:'padding-left:0; margin-top:12px;'}, group.label));
      items.forEach(it=>{
        const checked = working[activeTier].has(it.key);
        listWrap.appendChild(el('label',{style:'display:flex; align-items:center; gap:9px; padding:6px 2px; font-size:13.5px; cursor:pointer;'},
          el('input',{type:'checkbox', checked: checked?'checked':null, onchange:(e)=>{
            if(e.target.checked) working[activeTier].add(it.key); else working[activeTier].delete(it.key);
          }}),
          el('span',{}, it.icon+' '+it.label)
        ));
      });
    });
  }
  renderTabsBar(); renderCheckboxList();

  const body = el('div',{},
    el('div',{class:'text-dim', style:'font-size:12.5px; margin-bottom:12px;'},
      "Choisissez précisément les onglets accessibles à chaque niveau. Le Super Administrateur conserve toujours un accès complet à tout le logiciel. L'onglet « Utilisateurs » reste réservé au Super Administrateur dans tous les cas. Les rôles hérités (Administrateur, Comptable, Magasinier → alignés sur Gérant ; Vendeur → aligné sur Caissier) suivent automatiquement les permissions de leur niveau."
    ),
    tabsBar, listWrap
  );

  openModal({
    title:'🔐 Permissions par niveau d\'utilisateur',
    body, wide:true,
    footButtons:[
      el('button',{class:'btn btn-outline', onclick:closeModal},'Annuler'),
      el('button',{class:'btn btn-primary', onclick: async (e)=>{
        const btn = e.currentTarget; btn.disabled = true;
        try{
          const tiersData = {};
          editableTiers.forEach(t=> tiersData[t] = Array.from(working[t]));
          await fsSet('settings','permissions', { tiers: tiersData, modifiePar: STATE.user.uid, dateModification: serverTimestamp() });
          STATE.customPermissions = tiersData;
          await logAudit('modification','settings','permissions','Permissions par niveau mises à jour');
          toast('Permissions mises à jour.','success');
          closeModal();
          renderSidebar();
          if(!can(STATE.currentSection)) navigateTo('dashboard'); else navigateTo(STATE.currentSection);
        }catch(err){ toast(friendlyError(err),'error'); btn.disabled = false; }
      }}, 'Enregistrer les permissions')
    ]
  });
}

function openPurchaseForm(suppliers){
  if(!suppliers.length){ toast("Créez d'abord un fournisseur avant d'enregistrer un achat.",'warning'); return; }
  if(!STATE.products.length){ toast('Créez au moins un produit avant d\'enregistrer un achat.','warning'); return; }
  let rows = [{ productId:'', quantite:1, prixUnitaire:0 }];
  const body = el('div',{});
  body.appendChild(el('div',{class:'form-row'}, el('label',{},'Fournisseur *'), el('select',{class:'input', id:'pu-supplier'}, ...suppliers.map(s=>el('option',{value:s.id}, s.nom)))));

  function computeTotal(){ return rows.reduce((a,r)=> a + toInt(r.quantite)*toInt(r.prixUnitaire), 0); }
  function drawRows(){
    rowsWrap.innerHTML = '';
    rows.forEach((r,idx)=>{
      const prodSel = el('select',{class:'input', style:'flex:2;', onchange:(e)=>{ r.productId=e.target.value; const prod=STATE.products.find(x=>x.id===r.productId); if(prod){ r.prixUnitaire = toInt(prod.prixAchat)||0; } drawRows(); }},
        el('option',{value:''},'— Choisir un produit —'),
        ...STATE.products.map(p=>el('option',{value:p.id, selected:r.productId===p.id?'selected':null}, p.nom)));
      const qtyInp = el('input',{class:'input', type:'number', min:'1', style:'flex:1;', value:r.quantite, oninput:(e)=>{ r.quantite=toInt(e.target.value)||1; $('#pu-total').textContent = money(computeTotal()); }});

      ));
    });
    $('#pu-total').textContent = money(computeTotal());
  }
  drawRows();
  openModal({ title:'Nouvel achat', body, wide:true, footButtons:[
    el('button',{class:'btn btn-outline', onclick:closeModal},'Annuler'),
    el('button',{class:'btn btn-primary', onclick: async (e)=>{
      const supplierId = $('#pu-supplier').value;
      const supplier = suppliers.find(s=>s.id===supplierId);

async function receivePurchase(p){
  const ok = await confirmDialog(`Réceptionner l'achat ${p.numero} ? Le stock des ${((p.items||[]).length)} article(s) sera mis à jour.`, {title:"Réception d'achat"});
  if(!ok) return;
  const done = [];
  try{
    for(const item of (p.items||[])){
      await adjustStock(item.productId, item.quantite, 'achat', `Réception achat ${p.numero}`, p.id);
      done.push(item);
    }
    await fsUpdate('purchases', p.id, { statut:'receptionnee', dateReception: serverTimestamp() });
    await logAudit('reception','purchases', p.id, `Achat ${p.numero} réceptionné`);
    toast('Achat réceptionné, stock mis à jour.','success');
    await preloadReferenceData();
    navigateTo('purchases');
  }catch(error){
    for(const item of done){ try{ await adjustStock(item.productId, -item.quantite, 'ajustement', `Annulation automatique — échec réception achat ${p.numero}`, p.id); }catch(e2){} }
    toast(friendlyError(error),'error');
  }
}
async function cancelPurchase(p){
  const ok = await confirmDialog(`Annuler l'achat ${p.numero} ?`, {title:'Annulation', danger:true});
  if(!ok) return;
  try{ await fsUpdate('purchases', p.id, { statut:'annulee' }); await logAudit('annulation','purchases', p.id, `Achat ${p.numero} annulé`); toast('Achat annulé.','success'); navigateTo('purchases'); }
  catch(e){ toast(friendlyError(e),'error'); }
}

async function renderTransfers(root){

  }catch(e){ outgoing = []; }

  ));

    root.appendChild(el('div',{class:'card', style:'margin-bottom:16px;padding:14px;border-color:var(--warning);'},

        el('div',{}, el('div',{},`${t.productNom} — Qté ${t.quantite}`), el('div',{class:'text-faint',style:'font-size:12px;'}, `Depuis : ${t.sourceStoreNom||t.sourceStoreId}`)),
        el('button',{class:'btn btn-primary btn-sm', onclick:()=>receiveTransfer(t)}, '✅ Réceptionner')
      ))
    ));
  }

  const card = el('div',{class:'card'}, el('div',{class:'table-wrap'}));
  const table = el('table',{},
    el('thead',{}, el('tr',{}, el('th',{},'N°'), el('th',{},'Date'), el('th',{},'Produit'), el('th',{},'Qté'), el('th',{},'De'), el('th',{},'Vers'), el('th',{},'Statut'))),
    el('tbody',{}, ...(outgoing.length? outgoing.map(t=> el('tr',{},
      el('td',{class:'mono'}, t.numero||'—'),
