      el('td',{}, t.destStoreNom||t.destStoreId),
      el('td',{}, t.statut==='receptionne'? statusBadge('Réceptionné','success') : t.statut==='annule'? statusBadge('Annulé','danger') : statusBadge('En transit','warning'))
    )) : [el('tr',{}, el('td',{colspan:'7',class:'empty-state'},'Aucun transfert'))]))
  );
  card.querySelector('.table-wrap').appendChild(table);
  root.appendChild(card);

async function openTransferForm(){
  if(!STATE.products.length){ toast('Aucun produit disponible à transférer.','warning'); return; }
  let destStores = [];
  if(isSuperAdmin()){
    try{ destStores = (await fsGetAll('stores')).filter(s=> s.id !== STATE.store?.id); }catch(e){ destStores = STATE.stores.filter(s=>s.id!==STATE.store?.id); }
  }

  body.appendChild(el('div',{class:'form-row'}, el('label',{},'Produit à transférer *'),
    el('select',{class:'input', id:'tr-product'}, el('option',{value:''},'— Choisir —'), ...STATE.products.map(p=>el('option',{value:p.id}, `${p.nom} (stock: ${toInt(p.stock)})`)))));
  body.appendChild(el('div',{class:'form-row'}, el('label',{},'Quantité *'), el('input',{class:'input', id:'tr-qty', type:'number', min:'1', value:'1'})));
  if(isSuperAdmin() && destStores.length){
    body.appendChild(el('div',{class:'form-row'}, el('label',{},'Boutique de destination *'),
      el('select',{class:'input', id:'tr-dest'}, el('option',{value:''},'— Choisir —'), ...destStores.map(s=>el('option',{value:s.id}, s.nom)))));
  } else {
    body.appendChild(el('div',{class:'form-row'}, el('label',{},'Identifiant de la boutique de destination *'),
      el('input',{class:'input', id:'tr-dest', placeholder:'ID de la boutique (fourni par le Super Administrateur)'}),
      el('div',{class:'text-faint', style:'font-size:12px;margin-top:4px;'}, "Seul un Super Administrateur peut voir la liste complète des boutiques. Demandez-lui l'identifiant exact de la boutique de destination.")
    ));
  }

  openModal({ title:'Nouveau transfert', body, footButtons:[
    el('button',{class:'btn btn-outline', onclick:closeModal},'Annuler'),
    el('button',{class:'btn btn-primary', onclick: async (e)=>{
      const productId = $('#tr-product').value, qty = toInt($('#tr-qty').value), destStoreId = $('#tr-dest').value.trim();
      const prod = STATE.products.find(p=>p.id===productId);
      if(!productId || qty<=0 || !destStoreId){ toast('Renseignez le produit, la quantité et la destination.','warning'); return; }
      if(destStoreId === currentStoreId()){ toast('La boutique de destination doit être différente de la boutique actuelle.','warning'); return; }
      if(qty > toInt(prod?.stock)){ toast('Quantité supérieure au stock disponible.','warning'); return; }
      const btn = e.currentTarget; btn.disabled = true;
      try{
        let destStoreNom = (destStores.find(s=>s.id===destStoreId)||{}).nom || '';
        if(!destStoreNom){ try{ const ds = await fsGet('stores', destStoreId); destStoreNom = ds?.nom||''; }catch(e2){} }
        const numero = await nextNumber('TRF');

        };
        const id = await fsAdd('transfers', data);
        await logAudit('creation','transfers', id, `Transfert ${numero} : ${qty} x ${prod.nom} vers ${destStoreNom||destStoreId}`);
        toast('Transfert créé. Le stock de la boutique source a été décrémenté.','success');
        await preloadReferenceData();
        closeModal(); navigateTo('transfers');
      }catch(error){ toast(friendlyError(error),'error'); btn.disabled=false; }
    }}, 'Créer le transfert')
  ]});
}
async function receiveTransfer(t){
  let destProducts = [];
  try{ destProducts = await fsGetAll('products', where('boutiqueId','==', currentStoreId())); }catch(e){ destProducts = []; }
  const match = destProducts.find(p=> (t.productSku && p.sku===t.productSku) || (t.productReference && p.reference===t.productReference) || p.nom===t.productNom);
  const ok = await confirmDialog(
    match ? `Réceptionner ${t.quantite} x "${t.productNom}" ? Le stock sera ajouté au produit existant "${match.nom}".`
          : `Aucun produit correspondant trouvé dans votre boutique. Un nouveau produit "${t.productNom}" sera créé avec ${t.quantite} en stock initial.`,
    { title:'Réception de transfert' }
  );
  if(!ok) return;
  try{
    let targetId = match?.id;
    if(!targetId){
      targetId = await fsAdd('products', {
        nom: t.productNom, reference: t.productReference||'', sku: t.productSku||'', categorie:'', marque:'',
        prixAchat:0, prixVente:0, stock:0, stockMinimum:5, unite:'unité', description:'Créé automatiquement lors de la réception d\'un transfert.', photoUrl:'', photoPath:'',
        boutiqueId: currentStoreId(), actif:true
      });
    }
    await adjustStock(targetId, t.quantite, 'transfert_entree', `Réception transfert ${t.numero} depuis ${t.sourceStoreNom||t.sourceStoreId}`, t.id);
    await fsUpdate('transfers', t.id, { statut:'receptionne', dateReception: serverTimestamp(), receptionUserId: STATE.user.uid, destProductId: targetId });
    await logAudit('reception','transfers', t.id, `Transfert ${t.numero} réceptionné`);
    toast('Transfert réceptionné, stock mis à jour.','success');
    await preloadReferenceData();
    navigateTo('transfers');
  }catch(error){ toast(friendlyError(error),'error'); }
}

function isPromotionActive(pr){
  if(!pr || pr.actif===false) return false;
  const now = new Date();
  const start = pr.dateDebut ? toDate(pr.dateDebut) : null;
  const end = pr.dateFin ? toDate(pr.dateFin) : null;
  if(start && now < start) return false;
  if(end && now > new Date(end.getTime()+86400000)) return false;
  return true;
}
function getActivePromotionForProduct(product){
  if(!product || !STATE.promotionsCache || !STATE.promotionsCache.length) return null;
  const applicable = STATE.promotionsCache.filter(pr=> isPromotionActive(pr) && (
    pr.cible==='tout' || (pr.cible==='produit' && pr.productId===product.id) || (pr.cible==='categorie' && pr.categorie && pr.categorie===product.categorie)
  ));
  if(!applicable.length) return null;
  return applicable.reduce((best,pr)=>{
    const discBest = best ? (best.type==='pourcentage'? toInt(product.prixVente)*toInt(best.valeur)/100 : toInt(best.valeur)) : -1;
    const discCur = pr.type==='pourcentage'? toInt(product.prixVente)*toInt(pr.valeur)/100 : toInt(pr.valeur);
    return discCur > discBest ? pr : best;
  }, null);
}
async function ensurePromotionsCache(force=false){
  const now = Date.now();
  if(!force && STATE.promotionsCache.length !== undefined && STATE._promoCacheAt && (now-STATE._promoCacheAt)<60000) return;
  try{ STATE.promotionsCache = await fsGetAll('promotions', ...storeScoped()); }
  catch(e){ try{ STATE.promotionsCache = await fsGetAll('promotions'); }catch(e2){ STATE.promotionsCache = []; } }
  STATE._promoCacheAt = Date.now();
}

async function redeemLoyaltyPoints(c,cfg){
  const points = toInt(c.pointsFidelite||0);
  const value = points*cfg.redeemRate;
  const ok = await confirmDialog(`Convertir les ${points} points de ${c.prenom||''} ${c.nom||''} en réduction de ${money(value)}, déduite de sa dette actuelle ?`, {title:'Conversion des points'});
  if(!ok) return;
  try{
    const custRef = doc(db,'customers',c.id);
    await runTransaction(db, async(tx)=>{
      const snap = await tx.get(custRef);
      const debt = moneyPlain(snap.data().soldeDette||0);
      tx.update(custRef, { pointsFidelite:0, soldeDette: Math.max(0, debt-value) });
    });
    await fsAdd('loyaltyTransactions', { customerId:c.id, type:'conversion', points:-points, valeur:value, boutiqueId:currentStoreId(), userId:STATE.user.uid, date:serverTimestamp() });
    await logAudit('conversion','loyalty', c.id, `${points} points convertis en ${money(value)}`);
    toast('Points convertis et déduits de la dette du client.','success');
    await preloadReferenceData(); navigateTo('loyalty');
  }catch(e){ toast(friendlyError(e),'error'); }
}

async function renderReports(root){
  root.innerHTML='';
  if(!can('reports')){ root.innerHTML = accessDeniedBlock(); return; }
  STATE._reportPeriod = STATE._reportPeriod || 'month';
  const range = periodRange(STATE._reportPeriod);

  root.appendChild(el('div',{class:'section-head'}, el('div',{}, el('h2',{},'Rapports'), el('div',{class:'sub'},'Vue consolidée calculée à partir des données réelles du système'))));
  root.appendChild(el('div',{class:'toolbar'}, periodSelect(STATE._reportPeriod, v=>{ STATE._reportPeriod=v; navigateTo('reports'); })));

  const [salesAll, expensesAll, purchasesAll] = await Promise.all([
    fsGetAll('sales', ...storeScoped()).catch(()=>[]),
    fsGetAll('expenses', ...storeScoped()).catch(()=>[]),
    fsGetAll('purchases', ...storeScoped()).catch(()=>[])
  ]);
  const sales = salesAll.filter(s=> s.statut!=='annulee' && inRange(s.date, range));
  const expenses = expensesAll.filter(x=> inRange(x.date, range));
  const purchases = purchasesAll.filter(p=> p.statut!=='annulee' && inRange(p.date, range));

  const ca = sales.reduce((a,s)=>a+moneyPlain(s.total),0);
  const coutAchatVentes = sales.reduce((a,s)=> a + (s.items||[]).reduce((b,i)=>b+toInt(i.prixAchat)*toInt(i.quantite),0), 0);
  const totalExpenses = expenses.reduce((a,x)=>a+moneyPlain(x.montant),0);
  const totalPurchases = purchases.reduce((a,p)=>a+moneyPlain(p.total),0);
  const marge = ca - coutAchatVentes - totalExpenses;

  root.appendChild(el('div',{class:'stat-grid'},
    el('div',{class:'stat-card'}, el('div',{class:'label'},"💰 Chiffre d'affaires"), el('div',{class:'value'}, money(ca))),
    el('div',{class:'stat-card'}, el('div',{class:'label'},'🧾 Ventes'), el('div',{class:'value'}, sales.length)),
    el('div',{class:'stat-card'}, el('div',{class:'label'},'💸 Dépenses'), el('div',{class:'value'}, money(totalExpenses))),
    el('div',{class:'stat-card'}, el('div',{class:'label'},'🚚 Achats'), el('div',{class:'value'}, money(totalPurchases))),
    el('div',{class:'stat-card'}, el('div',{class:'label'},'📈 Marge nette estimée'), el('div',{class:'value', style:`color:${marge>=0?'var(--success)':'var(--danger)'};`}, money(marge)))
  ));

  const byDay = {};
  sales.forEach(s=>{ const d = toDateSafe(s.date); const k = d.toISOString().slice(0,10); byDay[k]=(byDay[k]||0)+moneyPlain(s.total); });
  const days = Object.keys(byDay).sort();
  root.appendChild(el('div',{class:'card', style:'padding:16px;margin-bottom:20px;'}, el('div',{style:'font-weight:700;margin-bottom:10px;'},'Ventes par jour'), el('canvas',{id:'report-chart', height:'90'})));

  const byProduct = {};
  sales.forEach(s=> (s.items||[]).forEach(i=>{ byProduct[i.productId] = byProduct[i.productId] || {nom:i.nom, qte:0, ca:0}; byProduct[i.productId].qte += toInt(i.quantite); byProduct[i.productId].ca += toInt(i.prixVente)*toInt(i.quantite); }));
  const topProducts = Object.values(byProduct).sort((a,b)=>b.ca-a.ca).slice(0,8);

  const byCustomer = {};
  sales.forEach(s=>{ if(!s.customerId) return; byCustomer[s.customerId] = (byCustomer[s.customerId]||0)+moneyPlain(s.total); });
  const topCustomers = Object.entries(byCustomer).map(([id,ttl])=>{ const c = STATE.customers.find(x=>x.id===id)||{}; return { total:ttl, nom:c.nom, prenom:c.prenom }; }).sort((a,b)=>b.total-a.total).slice(0,8);

  const grid = el('div',{class:'form-grid'});
  grid.appendChild(el('div',{class:'card', style:'padding:16px;'},
    el('div',{style:'font-weight:700;margin-bottom:10px;'},'🏆 Top produits vendus'),
    topProducts.length ? el('table',{}, el('thead',{},el('tr',{},el('th',{},'Produit'),el('th',{},'Qté'),el('th',{},'CA'))),
      el('tbody',{}, ...topProducts.map(p=>el('tr',{},el('td',{},p.nom),el('td',{},p.qte),el('td',{},money(p.ca)))))
    ) : el('div',{class:'empty-state'},'Aucune vente sur cette période')
  ));
  grid.appendChild(el('div',{class:'card', style:'padding:16px;'},
    el('div',{style:'font-weight:700;margin-bottom:10px;'},'👑 Meilleurs clients'),
    topCustomers.length ? el('table',{}, el('thead',{},el('tr',{},el('th',{},'Client'),el('th',{},'CA'))),
      el('tbody',{}, ...topCustomers.map(c=>el('tr',{},el('td',{},`${c.prenom||''} ${c.nom||''}`.trim()||'Client de passage'),el('td',{},money(c.total)))))
    ) : el('div',{class:'empty-state'},'Aucun client sur cette période')
  ));
  root.appendChild(grid);

  setTimeout(()=>{
    const canvas = $('#report-chart'); if(!canvas || typeof Chart==='undefined') return;
    if(STATE._reportChartInstance){ try{ STATE._reportChartInstance.destroy(); }catch(e){} }
    STATE._reportChartInstance = new Chart(canvas, {
      type:'bar',
      data:{ labels: days.map(d=> new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})), datasets:[{ label:'Ventes (FCFA)', data: days.map(d=>byDay[d]), backgroundColor:'#0f6e66' }] },
      options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{beginAtZero:true} } }
    });
  }, 30);
}

<!-- ============================================================================
DOCUMENTATION DE DÉPLOIEMENT — BRAINY STORE
============================================================================

1) FIREBASE — Installation
   - Utiliser le projet Firebase existant "suivre-coli" (config déjà intégrée).
   - Console : https://console.firebase.google.com/project/suivre-coli

2) ACTIVER AUTHENTICATION
   - Firebase Console → Authentication → Sign-in method → activer "Email/Password".
   - Créer manuellement le premier compte super_admin (Authentication → Users → Add user),
     puis, dans Firestore, éditer son document users/{uid} pour fixer role="super_admin".

3) CRÉER FIRESTORE
   - Firebase Console → Firestore Database → Créer une base (mode production).
   - Les collections se créent automatiquement à la première écriture de l'application
     (users, stores, products, sales, stockMovements, customers, customerPayments,
      cashRegisters, cashMovements, auditLogs, counters, etc.).

4) RÈGLES FIRESTORE (exemple à adapter et coller dans Firestore → Règles) :

   ⚠️ IMPORTANT (correctif) : la règle /products/{id} ci-dessous a été corrigée pour
   autoriser un Caissier à décrémenter le champ "stock" lors d'un encaissement POS
   (auparavant réservé à Gérant/Super Admin, ce qui bloquait silencieusement le
   bouton "Encaisser" pour les comptes Caissier). Si des règles sont déjà déployées
   dans la Console Firebase, il faut RECOLLER ce bloc mis à jour et le publier pour
   que la correction prenne effet en production.

rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function isSignedIn() { return request.auth != null; }
    function myProfile() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
    function myRole() { return myProfile().role; }
    function myStore() { return myProfile().boutiqueId; }
    // Palier réel du rôle : identique à roleTier() côté client (LEGACY_ROLE_TIER),
    // afin que les anciens comptes (admin/vendeur/magasinier/comptable) restent
    // fonctionnels sans avoir besoin d'être réécrits en base.
    function myTier() {
      return myRole() == 'super_admin' ? 'super_admin'
           : myRole() in ['gerant','admin','comptable','magasinier'] ? 'gerant'
           : 'caissier'; // caissier, vendeur, ou tout rôle inconnu -> palier le plus bas par défaut
    }
    function isSuperAdmin() { return isSignedIn() && myTier() == 'super_admin'; }
    function isGerantOrAbove() { return isSignedIn() && (myTier() == 'super_admin' || myTier() == 'gerant'); }
    function sameStore(storeId) { return isSignedIn() && (isSuperAdmin() || myStore() == storeId); }

    match /users/{uid} {
      allow read: if isSignedIn() && (request.auth.uid == uid || isGerantOrAbove());
      // Un utilisateur peut modifier ses propres infos (nom, téléphone, photo) mais
      // JAMAIS son propre rôle ou sa boutique — seul le Super Admin le peut (allow write ci-dessous).
      allow update: if isSignedIn() && request.auth.uid == uid
                    && request.resource.data.role == resource.data.role
                    && request.resource.data.boutiqueId == resource.data.boutiqueId
                    && request.resource.data.actif == resource.data.actif;
      allow create, delete: if isSuperAdmin();
      allow write: if isSuperAdmin(); // gestion des comptes/rôles/statut : Super Admin exclusivement
    }

    match /stores/{storeId} {
      allow read: if sameStore(storeId);
      allow write: if isSuperAdmin();
    }

    match /products/{id} {
      allow read: if isSignedIn() && sameStore(resource.data.boutiqueId);
      allow create: if isSignedIn() && sameStore(resource.data.boutiqueId) && isGerantOrAbove();
      // IMPORTANT : un Caissier doit pouvoir décrémenter le stock au moment d'une vente
      // POS (bouton "Encaisser"), sinon l'écriture est bloquée par les règles et
      // l'encaissement échoue silencieusement côté client. On l'autorise donc, mais en
      // restreignant strictement les champs qu'il peut modifier à stock/dateModification
      // (jamais le prix, le nom, etc., qui restent réservés à Gérant/Super Admin).
      allow update: if isSignedIn() && sameStore(resource.data.boutiqueId) && (
                      isGerantOrAbove() ||
                      (myTier() == 'caissier' &&
                       request.resource.data.diff(resource.data).affectedKeys().hasOnly(['stock','dateModification']))
                    );
      allow delete: if isGerantOrAbove();
    }

    match /stockMovements/{id} {
      allow read: if sameStore(resource.data.boutiqueId);
      // Le Caissier ne crée pas de mouvement de stock manuel : seule une vente (via /sales)
      // en déclenche un, en toute rigueur créée par un rôle Gérant+ ou par la logique de vente.
      allow create: if isSignedIn() && (isGerantOrAbove() || myTier() == 'caissier');
      allow update, delete: if false; // les mouvements de stock sont immuables
    }

    match /purchases/{id} { allow read: if sameStore(resource.data.boutiqueId); allow write: if isGerantOrAbove(); }
    match /suppliers/{id} { allow read: if sameStore(resource.data.boutiqueId); allow write: if isGerantOrAbove(); }
    match /transfers/{id} { allow read, write: if isGerantOrAbove(); }
    match /expenses/{id} { allow read, write: if isGerantOrAbove(); }
    match /financeMovements/{id} { allow read, write: if isGerantOrAbove(); }
    match /promotions/{id} { allow read: if isSignedIn(); allow write: if isGerantOrAbove(); }
    match /loyaltyAccounts/{id} { allow read: if isSignedIn(); allow write: if isSignedIn(); }
    match /orders/{id} { allow read: if isSignedIn(); allow write: if isSignedIn(); }
    match /employees/{id} {
      allow read: if isSignedIn();
      allow write: if isSignedIn(); // Gérant+ et Caissier peuvent tous deux gérer les employés (cf. cahier des charges)
    }
    match /sellers/{id} { allow read, write: if isSignedIn(); }
    match /marketMissions/{id} { allow read, write: if isSignedIn(); }

    match /sales/{id} {
      allow read: if sameStore(resource.data.boutiqueId);
      allow create: if isSignedIn();
      allow update: if isGerantOrAbove(); // annulation réservée aux Gérant/Super Admin
      allow delete: if false;
    }

    match /customers/{id} {
      allow read, create: if isSignedIn() && sameStore(resource.data.boutiqueId);
      allow update: if isSignedIn() && sameStore(resource.data.boutiqueId);
      allow delete: if isGerantOrAbove();
    }

    match /cashRegisters/{id} {
      allow read: if sameStore(resource.data.boutiqueId);
      allow create, update: if isSignedIn();
    }
    match /cashMovements/{id} {
      allow read: if sameStore(resource.data.boutiqueId);
      allow create: if isSignedIn();
    }

    match /auditLogs/{id} {
      allow read: if isGerantOrAbove();
      allow create: if isSignedIn();
      allow update, delete: if false;
    }

    match /counters/{id} {
      allow read, write: if isSignedIn();
    }

    // Règle générique de repli pour toute collection non listée explicitement ci-dessus :
    match /{document=**} {
      allow read, write: if isGerantOrAbove();
    }
  }
}

6) CONFIGURATION DU WORKER (à déployer séparément, PAS dans ce HTML)

   export default {
     async fetch(request, env) {
       const url = new URL(request.url);
       const key = decodeURIComponent(url.pathname.slice(1));
       const corsHeaders = {
         "Access-Control-Allow-Origin": "*",
         "Access-Control-Allow-Methods": "GET,PUT,DELETE,HEAD,OPTIONS",
         "Access-Control-Allow-Headers": "Content-Type"
       };
       if (request.method === "OPTIONS") return new Response(null, { headers: corsHeaders });
       if (!key) return new Response("Clé manquante", { status: 400, headers: corsHeaders });

       switch (request.method) {
         case "PUT": {
           await env.MY_BUCKET.put(key, request.body, {
             httpMetadata: { contentType: request.headers.get("Content-Type") || "application/octet-stream" }
           });
           return new Response(JSON.stringify({ ok: true, key }), { headers: { ...corsHeaders, "Content-Type": "application/json" } });
         }
         case "GET": {
           const obj = await env.MY_BUCKET.get(key);
           if (!obj) return new Response("Introuvable", { status: 404, headers: corsHeaders });
           const headers = new Headers(corsHeaders);
           obj.writeHttpMetadata(headers);
           headers.set("etag", obj.httpEtag);
           return new Response(obj.body, { headers });
         }
         case "HEAD": {
           const obj = await env.MY_BUCKET.head(key);
           if (!obj) return new Response(null, { status: 404, headers: corsHeaders });
           return new Response(null, { headers: corsHeaders });
         }
         case "DELETE": {
           await env.MY_BUCKET.delete(key);
           return new Response(JSON.stringify({ ok: true }), { headers: { ...corsHeaders, "Content-Type": "application/json" } });
         }
         default:
           return new Response(`${request.method} non autorisé.`, { status: 405, headers: { ...corsHeaders, Allow: "GET,PUT,DELETE,HEAD" } });
       }
     }
   };

   - Ne JAMAIS placer de token/API secret R2 dans ce fichier HTML : le binding
     env.MY_BUCKET est configuré uniquement côté Cloudflare (wrangler.toml / dashboard).
   - Restreindre si besoin le Worker par CORS (Access-Control-Allow-Origin) au domaine
     exact d'hébergement de brainy-store.html en production.
